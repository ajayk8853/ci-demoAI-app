spring:
  application:
    name: guardian-ai

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/guardian?options=-c%20TimeZone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:guardian}
    password: ${SPRING_DATASOURCE_PASSWORD:guardian}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring.lifecycle:
  timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

github:
  token: ${GITHUB_TOKEN:}
  owner: ${GITHUB_OWNER:ajayk8853}
  repository: ${GITHUB_REPOSITORY:ci-demoAI-app}

pipeline:
  provider: ${PIPELINE_PROVIDER:github}

tekton:
  api-url: ${TEKTON_API_URL:}
  namespace: ${TEKTON_NAMESPACE:}
  token: ${TEKTON_TOKEN:}
  insecure-skip-tls-verify: ${TEKTON_INSECURE_SKIP_TLS_VERIFY:false}

openai:
  api-key: ${OPENAI_API_KEY:}
