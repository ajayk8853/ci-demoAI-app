spring:
  application:
    name: guardian-ai

  datasource:
    url: jdbc:postgresql://localhost:5432/guardian?options=-c%20TimeZone=UTC
    username: guardian
    password: guardian

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.jdbc.time_zone: UTC

server:
  port: 8080

github:
  token: ${GITHUB_TOKEN:}
  owner: ${GITHUB_OWNER:}
  repository: ${GITHUB_REPOSITORY:}

openai:
  api-key: ${OPENAI_API_KEY:}
