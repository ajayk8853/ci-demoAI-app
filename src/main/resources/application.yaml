spring:
  application:
    name: guardian-ai

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/guardian?options=-c%20TimeZone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:guardian}
    password: ${SPRING_DATASOURCE_PASSWORD:guardian}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

server:
  port: ${SERVER_PORT:8080}

github:
  token: ${GITHUB_TOKEN:}
  owner: ${GITHUB_OWNER:}
  repository: ${GITHUB_REPOSITORY:}

openai:
  api-key: ${OPENAI_API_KEY:}
